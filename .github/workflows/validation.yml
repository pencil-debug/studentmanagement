
name: Student Management Validation

on:
  push:

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: studentdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Run Maven tests
        id: tests
        continue-on-error: true
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/studentdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean test

      - name: Show Surefire reports
        if: steps.tests.outcome == 'failure'
        working-directory: backend
        run: |
          echo "========================================"
          echo "SUREFIRE TEST REPORTS"
          echo "========================================"

          find target/surefire-reports -type f -print || true

          for file in target/surefire-reports/*.txt; do
            if [ -f "$file" ]; then
              echo ""
              echo "========================================"
              echo "FILE: $file"
              echo "========================================"
              cat "$file"
            fi
          done

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed."
          exit 1

      - name: Build application
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/studentdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn clean package -DskipTests

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests
        run: |
          echo "========================================"
          echo "VALIDATING KUBERNETES MANIFESTS"
          echo "========================================"

          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/secret.yaml
          kubectl apply --dry-run=client -f k8s/mysql-pvc.yaml
          kubectl apply --dry-run=client -f k8s/mysql-deployment.yaml
          kubectl apply --dry-run=client -f k8s/mysql-service.yaml
          kubectl apply --dry-run=client -f k8s/app-deployment.yaml
          kubectl apply --dry-run=client -f k8s/app-service.yaml

          echo ""
          echo "========================================"
          echo "ALL KUBERNETES MANIFESTS ARE VALID"
          echo "========================================"

