
name: Student Management Validation

on:
  push:

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Run Maven tests
        id: tests
        continue-on-error: true
        working-directory: backend
        run: mvn clean test

      - name: Show Surefire reports
        if: steps.tests.outcome == 'failure'
        working-directory: backend
        run: |
          echo "========================================"
          echo "SUREFIRE REPORT FILES"
          echo "========================================"

          find target/surefire-reports -type f -maxdepth 1 -print || true

          echo ""
          echo "========================================"
          echo "SUREFIRE TEST REPORT"
          echo "========================================"

          for file in target/surefire-reports/*.txt; do
            if [ -f "$file" ]; then
              echo ""
              echo "========================================"
              echo "FILE: $file"
              echo "========================================"
              cat "$file"
            fi
          done

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed. See the Surefire report above."
          exit 1

      - name: Build application
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Validate Kubernetes manifests
        uses: azure/k8s-lint@v1
        with:
          manifests: |
            k8s/namespace.yaml
            k8s/secret.yaml
            k8s/mysql-pvc.yaml
            k8s/mysql-deployment.yaml
            k8s/mysql-service.yaml
            k8s/app-deployment.yaml
            k8s/app-service.yaml
